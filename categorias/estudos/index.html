<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-EMT-Equipes – Launcher</title>
    <link rel="stylesheet" href="../../assets/style.css">
  </head>
  <body class="launcher">
    <header class="header">
      <a href="../../index.html" class="back-btn">⬅ Voltar ao HUB</a>
      <span class="header-title">AI-EMT-Equipes – Launcher</span>
      <button id="themeToggle" class="theme-toggle">🌙</button>
    </header>

    <main class="launcher-main">

      <div class="container">
        <h1>AI-EMT-Equipes – Launcher</h1>
        <div class="toolbar">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <a class="btn" href="../../index.html">⬅ Menu</a>
            <button class="btn" id="openAll">Abrir TUDO</button>
            <button class="btn" id="addGroup">+ Grupo</button>
            <button class="btn" id="export">Exportar</button>
            <button class="btn" id="import">Importar</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label class="hint"><input type="checkbox" id="openCoverLast" checked> Abrir capa como última aba</label>
            
            <div style="display:flex;align-items:center;gap:6px">
              <label class="small">Atraso (ms)</label>
              <input class="btn" style="width:100px" type="number" id="delay" min="0" step="50" value="0">
            </div>
          </div>
        </div>

        <div id="groups" class="row"></div>

        <div class="footer">
          <span>Configuração salva no navegador. Clique no título do grupo p/ minimizar/expandir.</span>
          <button class="btn" id="reset">Restaurar padrão</button>
        </div>
      </div>
      
    </main>

    <script src="assets/Estudosgroups.js"></script>
    
    <script>
      const KEY = "ia-launcher-config:" + "AI-EMT-Equipes";
      const GROUP_COVER_PAGE="estudos.html";
      const COVER_KEY=KEY;
      
      window.LAUNCHER_APP_ID = "AI-EMT-Equipes";
      
      const DEFAULT_GROUPS = window.GROUPS || [];
    </script>
    
    <script src="../../assets/script.js"></script> 
    <script src="../../assets/script-launcher.js"></script>
    
  </body>
  
</html>
